[package]
name = "cdp-oracle"
description = "Golden-test harness for the CDP System port: records a case by running the legacy binaries in Docker, then replays it against the Rust build with no Docker needed (gate 3 of docs/migration/PLAN-V2.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "cdp-oracle"
path = "src/main.rs"

[dependencies]
cdp-programs = { path = "../../crates/cdp-programs" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
