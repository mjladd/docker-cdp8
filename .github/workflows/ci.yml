name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The workspace has no members until Phase 1 (see
      # docs/migration/PLAN.md) adds the first crate under crates/.
      # `cargo fmt`/`clippy`/`test` all hard-error on a workspace with
      # zero members (verified locally: "Failed to find targets" /
      # "the workspace has no members"), so these steps skip cleanly
      # rather than fail until there is something to check.
      - name: Check for workspace members
        id: members
        run: |
          n=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print(len(json.load(sys.stdin)['packages']))")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "Workspace has $n member(s)"
      - name: Check formatting
        if: steps.members.outputs.count != '0'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: steps.members.outputs.count != '0'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.members.outputs.count != '0'
        run: cargo test --workspace
      # Gate 3 of docs/migration/PLAN-V2.md. Replaying a recorded case
      # needs the built binaries but no Docker, so it belongs in this
      # fast job rather than in the image-based one below.
      - name: Build the binaries for the golden replay
        if: steps.members.outputs.count != '0'
        run: cargo build --workspace
      - name: Golden cases (gate 3, replay only, no Docker)
        if: steps.members.outputs.count != '0'
        run: cargo run -q -p cdp-oracle -- verify

  legacy-build:
    name: Legacy C reference build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the legacy Docker image
        run: docker build -f docker-cdp8/Dockerfile -t cdp8-legacy .
      - name: Sanity check the binary set
        run: |
          count=$(docker run --rm cdp8-legacy ls /opt/cdp/bin | wc -l)
          echo "Built $count legacy binaries"
          test "$count" -ge 200
      - name: Smoke test core commands
        run: |
          mkdir -p /tmp/cdp-smoke
          docker run --rm -v /tmp/cdp-smoke:/w cdp8-legacy bash -c '
            cd /w
            synth wave 1 sine.wav 44100 1 2 440
            sndinfo props sine.wav
            pvoc anal 1 sine.wav sine.ana
          '
      - name: Save the image for the golden-test job
        run: docker save cdp8-legacy -o /tmp/cdp8-legacy.tar
      - uses: actions/upload-artifact@v4
        with:
          name: cdp8-legacy-image
          path: /tmp/cdp8-legacy.tar
          retention-days: 1

  golden-drift:
    name: Golden expectations still match legacy
    needs: [rust, legacy-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: cdp8-legacy-image
          path: /tmp
      - name: Load the legacy image
        run: docker load -i /tmp/cdp8-legacy.tar
      # The harness must exist. The previous version of this job passed
      # when tools/oracle was absent, which is why seven defective
      # sub-commands merged green (see PLAN-V2 section 3.2).
      - name: Require the oracle harness
        run: test -f tools/oracle/Cargo.toml
      # Re-record every case against the real legacy image and fail if
      # any committed expectation moved. This catches an expectation that
      # was edited by hand rather than recorded, and it catches legacy
      # itself changing under an upstream sync. Re-recording is
      # deterministic: every timestamp in a recorded output comes from
      # the input file, not from the run.
      - name: Re-record every case and check for drift
        run: |
          cases=$(find spec/golden -name '*.toml' | sort)
          if [ -z "$cases" ]; then
            echo "no golden cases under spec/golden"
            exit 1
          fi
          CDP_ORACLE_IMAGE=cdp8-legacy cargo run -q -p cdp-oracle -- record $cases
          if ! git diff --exit-code --stat spec/golden; then
            echo
            echo "A committed expectation does not match what legacy produces now."
            echo "Either it was written by hand instead of recorded, or legacy changed."
            exit 1
          fi
          echo "every expectation still matches the legacy image"
