description = "error case: a start time past the end of the file, which the range check catches before the algorithm"
program = "sndinfo"
subcommand = "prntsnd"
argv = [
    "prntsnd",
    "in.wav",
    "out.txt",
    "999",
    "1000",
]

[[inputs]]
name = "in.wav"
from = "docs/manual/sounds/marimba.wav"

[expected]
exit_code = 255
stdout = """
ERROR: INCORRECT USE
ERROR: Parameter[1] Value (999.000000) out of range (0.000000 to 1.001678)


"""
stderr = ""

[[expected.outputs.created]]
name = "out.txt"
kind = "text"
byte_count = 0
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
content = ""
line_count = 0
