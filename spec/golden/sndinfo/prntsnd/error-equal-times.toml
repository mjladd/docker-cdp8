description = "error case: start and end are the same, which legacy also rejects as incompatible"
program = "sndinfo"
subcommand = "prntsnd"
argv = [
    "prntsnd",
    "in.wav",
    "out.txt",
    "0.0",
    "0.0",
]

[[inputs]]
name = "in.wav"
from = "docs/manual/sounds/marimba.wav"

[expected]
exit_code = 255
stdout = """
ERROR: INVALID DATA
ERROR: Incompatible start and end times.


"""
stderr = ""

[[expected.outputs.created]]
name = "out.txt"
kind = "text"
byte_count = 0
sha256 = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
content = ""
line_count = 0
