description = "the -a flag, which legacy documents but which aborts inside legacy itself (see LEGACY-BUGS.md)"
program = "housekeep"
subcommand = "remove"
argv = [
    "remove",
    "in.wav",
    "-a",
]
known_deviation = "Legacy cannot run this command at all (see LEGACY-BUGS.md), so the -a flag has no legacy behavior to match. The port now implements it: without -a the scan stops after ten missing names in total, with -a it scans all 999."

[[inputs]]
name = "in.wav"
from = "docs/manual/sounds/marimba.wav"

