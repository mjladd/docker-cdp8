description = "mode 1 bundles every entered file into an output text file"
program = "housekeep"
subcommand = "bundle"
argv = [
    "bundle",
    "1",
    "a.wav",
    "b.wav",
    "out.txt",
]
known_deviation = "PLAN-V2 phase R: the shipped code prints one trailing newline more than legacy"

[[inputs]]
name = "a.wav"
from = "docs/manual/sounds/marimba.wav"

[[inputs]]
name = "b.wav"
from = "docs/manual/sounds/clashmixtest.wav"

[expected]
exit_code = 0
stdout = """
BUNDLED a.wav
BUNDLED b.wav


"""
stderr = ""

[[expected.outputs.created]]
name = "out.txt"
kind = "text"
byte_count = 12
sha256 = "618efaa868225ba39784b537c8d396db5fc6c38068676c1ef0eed2b1261b8244"
content = """
a.wav
b.wav
"""
line_count = 2
