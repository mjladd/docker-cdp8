description = "the documented command line: two infiles and an outfile, with no gap argument"
program = "housekeep"
subcommand = "bakup"
argv = [
    "bakup",
    "a.wav",
    "b.wav",
    "out.wav",
]
known_deviation = "PLAN-V2 phase R: the shipped code demands a splicelen argument that legacy does not have, so it rejects this command line"

